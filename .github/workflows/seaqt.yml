name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  genbindings:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["5.15", "6.4", "6.5", "6.8", "6.11"]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Cache clang ASTs
      uses: actions/cache@v6
      with:
        path: cmd/genbindings/cachedir
        key: linux64-clang-cache-qt${{ matrix.version }}

    - name: Build bindings for Qt ${{ matrix.version }}
      run: make genbindings-${{ matrix.version }}

    - name: Assert no changes
      run: git submodule foreach 'git update-index --really-refresh && git diff-index HEAD'

  compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [ "5.15", "6.4" ]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Compile test (Qt ${{ matrix.version }})
      run: |
        make test-${{ matrix.version }} examples-${{ matrix.version }}
